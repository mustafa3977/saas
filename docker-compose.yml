version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: legacypixels-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: lp_admin
      MONGO_INITDB_ROOT_PASSWORD: lp_secret_password
      MONGO_INITDB_DATABASE: legacypixels
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: legacypixels-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
